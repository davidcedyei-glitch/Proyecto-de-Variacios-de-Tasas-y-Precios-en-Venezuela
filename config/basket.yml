# Basket configuration (reviewed 2026-11-07/08).
#
# Store selection: only stores whose product pages are public, rendered on the
# server (price present in the HTML), allowed by robots.txt, and not behind a
# bot challenge. Checked and NOT used:
#   - elplazas.com, centralmadeirense.com.ve, excelsiorgama.com: Cloudflare
#     bot challenge on every request (bypassing it is not acceptable).
#   - gamaenlinea.com: client-side app; the HTML has no prices (they come from
#     a private API, not a public page).
#   - forum.com.ve: no online catalogue of its own; Forum Supermayorista sells
#     online only through the Zupper app (zupper.market), which on 2026-11-08
#     returned Cloudflare origin errors (1000/409/530) for every page and for
#     robots.txt. Re-check later; not added while robots.txt can't be read.
#
# Terms of use (none forbids automated reading; all restrict republishing the
# site's "content"; Rio's terms are silent): see README > Stores and data use.
# Decision 2026-11-08: raw product-level prices are published (factual fields
# only, no images or descriptions); stores can request removal.
#
# `sku` is our own product key. The same sku in several stores means the SAME
# product and size, so cross-store comparisons are like-for-like. A different
# size or variant gets a different sku.
#
# Basket size is capped at 80 items; pharmacy items that matched no other
# store were dropped when Rio was added.
#
# Categories: alimentos, bebidas, limpieza, aseo_personal, bebe, medicamentos.

stores:
  # Sigo (nopCommerce). Shows prices in USD. robots.txt allows product pages.
  # Price comes from the schema.org microdata attribute <span itemprop="price"
  # content="1.38">. There is NO reliable stock signal: sold-out items keep the
  # "Añadir al carrito" button and show $0.00, which we record as zero_price.
  - name: sigo
    currency: USD
    method: css
    price_selector: "span[itemprop=price]"
    price_attr: content
