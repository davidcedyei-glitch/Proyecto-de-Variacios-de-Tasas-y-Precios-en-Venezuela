name: collect-data

on:
  schedule:
    - cron: "7 */4 * * *"      # FX rates every 4 hours
    - cron: "23 11 * * *"      # basket prices once a day (07:23 Caracas)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect FX
        run: PYTHONPATH=src python -m observatory.run fx
      - name: Collect prices (daily run only)
        if: github.event.schedule == '23 11 * * *' || github.event_name == 'workflow_dispatch'
        run: PYTHONPATH=src python -m observatory.run prices
      # Report-only: data is always committed, even when checks find problems,
      # so gaps stay visible. --strict marks the step red on error-level findings.
      - name: Data-quality checks
        continue-on-error: true
        run: PYTHONPATH=src python -m observatory.run quality --strict
      - name: Commit data
        run: |
          git config user.name "observatory-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/raw data/quality
          git diff --cached --quiet || git commit -m "data: update $(date -u +%FT%TZ)"
          git push
